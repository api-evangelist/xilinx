description: >-
  Xilinx was an American semiconductor company that invented the FPGA and built the Zynq SoC,
  Versal adaptive SoC and Alveo accelerator lines together with the Vivado and Vitis design
  toolchains, before AMD closed its $50B all-stock acquisition in February 2022. The brand no
  longer runs its own web properties — every xilinx.com path now redirects into amd.com — but
  github.com/Xilinx remains an active, verified organization of 469 public repositories, and it
  is the only place Xilinx still publishes machine-readable contracts: the proto3 gRPC services
  behind the PYNQ remote-device protocol, plus first-party Python packages for PYNQ, Brevitas,
  FINN, RapidWright and the XRT runtime. There is no Xilinx HTTP or REST API.

