  - id: rfc8594
    conforms: false
    evidence: No Sunset/Deprecation header policy; no HTTP API to carry one.
  - id: idempotency
    conforms: false
    evidence: >-
      No idempotency key or replay-protection mechanism in any of the 108 RPCs — see
      conventions/xilinx-conventions.yml idempotency.coverage = none.
  - id: pagination
    conforms: false
    evidence: No collection-returning RPC in the surface.
domain_standards:
  note: >-
    The semiconductor / EDA market's interchange standards (IEEE 1685 IP-XACT, IEEE 1801 UPF,
    IEEE 1735 IP encryption, SPIRIT) govern design-tool file formats, not service contracts.
    Nothing in Xilinx's published service contracts declares one, and no domain-standard
    conformance is asserted. This is reward-only scoring: an absent market standard is not
    a deduction, and inventing one to fill the slot would be fabrication.
  probed:
    - standard: IEEE 1685 (IP-XACT)
      declared_in_contract: false
    - standard: KServe / Open Inference Protocol
      declared_in_contract: false
      note: >-
        Checked because Vitis AI is an inference stack; the Vitis-AI protos are XIR graph
        serialization formats (graph_proto_v1/v2, target.proto), not an inference service
        contract, so no OIP conformance is claimed.
certifications:
  published: false
  note: >-
    No Xilinx-branded trust center or certification listing exists. AMD publishes corporate
    security and compliance material at amd.com, but that is the parent company's artifact and
