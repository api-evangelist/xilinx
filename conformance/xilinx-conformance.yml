conformance:
  - id: protobuf3
    conforms: true
    evidence: >-
      All six service definitions declare `syntax = "proto3"` — see
      grpc/xilinx-pynq-mmio.proto line 1.
  - id: grpc
    conforms: true
    evidence: >-
      Six `service` blocks with 108 `rpc` methods, including client- and server-streaming
      signatures (buffer.RemoteBuffer/read returns `stream BufferReadResponse`).
  - id: openapi
    conforms: false
    evidence: >-
      /openapi.json, /openapi.yaml, /swagger.json and /api-docs all 404 or redirect on
      www.xilinx.com; a GitHub code search for `org:Xilinx filename:openapi` returns 0 results.
  - id: asyncapi
    conforms: false
    evidence: No event, streaming or webhook contract published; no asyncapi document in the org.
  - id: oauth2
    conforms: false
    evidence: >-
      https://www.xilinx.com/.well-known/oauth-authorization-server returns 404; no proto
      declares credentials.
  - id: oidc
    conforms: false
    evidence: https://www.xilinx.com/.well-known/openid-configuration returns 404.
  - id: rfc9457
    conforms: false
    evidence: >-
      Errors are in-band boolean+string fields inside the response message; no
      application/problem+json surface exists (see conventions/xilinx-conventions.yml).
  - id: rfc9116
    conforms: false
    evidence: >-
      https://www.xilinx.com/.well-known/security.txt returns 302 to a marketing page, not
