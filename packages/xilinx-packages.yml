generated: '2026-09-04'
method: searched
source: >-
  PyPI JSON metadata endpoints (pypi.org/pypi/<pkg>/json) and the GitHub Xilinx organization
  (github.com/Xilinx), queried 2026-09-04.
note: >-
  Xilinx ships no HTTP API client libraries — it has no HTTP API. What it publishes are
  first-party Python packages for its adaptive-computing stack (PYNQ board framework,
  Brevitas quantization, FINN dataflow compiler, RapidWright). Versions and dates below are
  read from each registry's metadata endpoint, not from prose.
registries_checked: [pypi, npm, maven-central, crates.io]
registries_with_nothing:
  - registry: npm
    note: >-
      npm search for "xilinx" returns only third-party packages (xilt, an unaffiliated
      Bitbucket-hosted build helper). Xilinx publishes no npm scope.
  - registry: maven-central
    note: >-
      search.maven.org timed out on the com.xilinx* group query on 2026-09-04; RapidWright's
      Java artifacts are distributed as GitHub release JARs. version null — not checked
      successfully, recorded as a gap rather than a guess.
