excluded:
  - name: xrt
    registry: pypi
    reason: >-
      NOT Xilinx. pypi.org/project/xrt is "Ray tracing and wave propagation in x-ray regime"
      by Konstantin Klementiev and Roman Chernikov (xrt.readthedocs.io). The Xilinx Runtime
      (XRT) is distributed as DEB/RPM packages and GitHub releases, not on PyPI.
      A name-only match would have credited Xilinx with another project's package.
  - name: qonnx
    registry: pypi
    reason: >-
      Published from github.com/fastmachinelearning/qonnx, a community organization Xilinx
      contributes to but does not own.
