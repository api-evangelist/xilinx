note: >-
  Xilinx publishes no HTTP/REST API. Its only machine-readable service contracts are the
  Protocol Buffers / gRPC service definitions shipped in the first-party Xilinx/PYNQ repository
  (BSD-3-Clause), which define the PYNQ remote-device protocol: a gRPC server runs on the
  Zynq/RFSoC board and a PYNQ client on a host machine drives the board's MMIO, GPIO, DMA
  buffers, RF data converter and RF clocking over it. These are on-device endpoints — there is
  no vendor-operated host — so no baseURL is recorded.
ownership:
  verdict: first-party
  evidence: >-
    Files are served from github.com/Xilinx/PYNQ, the verified Xilinx GitHub organization
    (2,341 stars, org "blog" field www.amd.com), under the PYNQ project Xilinx has maintained
    since 2016. Proto packages are gpio/mmio/xrfdc/buffer/xrfclk/remote_device — PYNQ's own
    driver surface, not a third party's.
transport: gRPC (proto3)
services:
  - file: grpc/xilinx-pynq-remote-device.proto
    package: remote_device
    service: RemoteDevice
    rpcs: 7
    methods: [set_bitstream_attrs, download, set_pl_clk, shutdown, readfile, writefile, existsfile]
    streaming: [download (client), readfile (server), writefile (client)]
    summary: Bitstream download and file transfer to the remote PYNQ board.
  - file: grpc/xilinx-pynq-mmio.proto
    package: mmio
    service: Mmio
    rpcs: 3
    methods: [get_mmio, read, write]
    summary: Memory-mapped IO register access on the programmable logic.
