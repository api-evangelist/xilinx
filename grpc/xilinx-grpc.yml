    package: gpio
    service: Gpio
    rpcs: 7
    methods: [get_gpio, read, write, unexport, is_exported, get_gpio_base_path, get_gpio_npins]
    summary: Linux sysfs GPIO pin export, read and write.
  - file: grpc/xilinx-pynq-buffer.proto
    package: buffer
    service: RemoteBuffer
    rpcs: 9
    methods: [allocate, write, read, freebuffer, flush, invalidate, physical_address, virtual_address, cacheable]
    streaming: [write (client), read (server)]
    summary: Contiguous DMA buffer allocation, cache maintenance and address translation.
  - file: grpc/xilinx-pynq-xrfdc.proto
    package: xrfdc
    service: Xrfdc
    rpcs: 77
